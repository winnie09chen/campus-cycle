<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23c8192e'/><text x='32' y='32' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='-apple-system,PingFang SC,Microsoft YaHei,sans-serif'>候</text></svg>" />
  <title>个人中心 · 物候</title>
  <style>
    :root {
      --red: #c8192e; --red-dark: #9f1426; --red-soft: #fff1f3;
      --ink: #20242a; --muted: #68707d; --line: #e6e8ec; --bg: #f7f8fa; --card: #fff;
      --ok: #168a52; --warn: #b56a00; --bad: #b42318;
      --shadow: 0 16px 40px rgba(32,36,42,.08); --shadow-btn: 0 6px 16px rgba(32,36,42,.12);
      --ease: cubic-bezier(0.4,0,0.2,1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }

    .topbar { height: 64px; background: var(--card); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--red); color: #fff;
      display: grid; place-items: center; font-weight: 800; }
    .brand-title { font-size: 16px; font-weight: 760; }
    .back-btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px;
      padding: 9px 14px; font-weight: 700; text-decoration: none; display: inline-block; }
    .back-btn:hover { border-color: var(--red); color: var(--red); transform: translateY(-1px); box-shadow: var(--shadow-btn); }

    .wrap { width: min(560px, calc(100% - 40px)); margin: 28px auto 60px; display: grid; gap: 18px; }

    .profile-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); padding: 26px 24px; display: flex; align-items: center; gap: 18px; }
    .profile-card .avatar { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; color: #fff; font-weight: 800; font-size: 34px; flex: 0 0 auto; }
    .pc-name { font-size: 20px; font-weight: 780; }
    .pc-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .pc-tags { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
    .tag { border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; background: #f2f3f5; color: #4c5563; }
    .tag.role { background: var(--red-soft); color: var(--red); }
    .tag.ok { background: #eaf7f0; color: var(--ok); }
    .tag.warn { background: #fff7e6; color: var(--warn); }
    .tag.bad { background: #fff1f0; color: var(--bad); }

    .section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 22px; }
    .section h3 { margin: 0 0 14px; font-size: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 15px; }
    .field input:focus { outline: none; border-color: var(--red); }
    .row { display: flex; gap: 10px; align-items: flex-end; }
    .row .field { flex: 1; margin-bottom: 0; }
    .btn { border: 0; border-radius: 9px; padding: 10px 18px; font-weight: 760; }
    .btn.primary { background: var(--red); color: #fff; }
    .btn.primary:hover { background: var(--red-dark); }
    .btn.primary:disabled { background: #d9a0a7; cursor: not-allowed; }
    .btn.ghost { background: #f2f3f5; color: var(--ink); }
    .btn.danger { background: #fff1f0; color: var(--bad); width: 100%; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-btn); }
    .btn:active { transform: scale(.97); }

    .msg { font-size: 13px; margin-top: 10px; padding: 9px 12px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.err { background: var(--red-soft); color: var(--bad); }
    .msg.ok { background: #eaf7f0; color: var(--ok); }

    .loading { text-align: center; color: var(--muted); padding: 60px 0; }

    @media (max-width: 600px) {
      .topbar { padding: 0 14px; }
      .wrap { width: calc(100% - 24px); margin-top: 18px; gap: 12px; }
      .profile-card { padding: 18px 16px; gap: 12px; }
      .profile-card .avatar { width: 56px; height: 56px; font-size: 26px; }
      .pc-name { font-size: 18px; }
      .section { padding: 16px; }
      .row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">候</div>
      <div class="brand-title">物候 · 个人中心</div>
    </div>
    <a class="back-btn" id="backBtn" href="index.html">← 返回</a>
  </header>

  <div class="wrap">
    <div class="loading" id="loading">加载中…</div>

    <div class="profile-card" id="profileCard" style="display:none;"></div>

    <section class="section" id="nickSection" style="display:none;">
      <h3>修改昵称</h3>
      <div class="row">
        <div class="field">
          <label>新昵称</label>
          <input id="nickInput" type="text" maxlength="20" placeholder="输入新昵称" />
        </div>
        <button class="btn primary" id="nickSave">保存</button>
      </div>
      <div class="msg" id="nickMsg"></div>
    </section>

    <section class="section" id="pwdSection" style="display:none;">
      <h3>修改密码</h3>
      <div class="field">
        <label>旧密码</label>
        <input id="oldPwd" type="password" autocomplete="current-password" placeholder="当前密码" />
      </div>
      <div class="field">
        <label>新密码（至少 6 位）</label>
        <input id="newPwd" type="password" autocomplete="new-password" placeholder="新密码" />
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input id="confirmPwd" type="password" autocomplete="new-password" placeholder="再次输入新密码" />
      </div>
      <button class="btn primary" id="pwdSave" style="width:100%;">修改密码</button>
      <div class="msg" id="pwdMsg"></div>
    </section>

    <button class="btn danger" id="logoutBtn" style="display:none;">退出登录</button>
  </div>

  <script src="./config.js"></script>
  <script src="./auth-module.js"></script>
  <script>
    (function () {
      "use strict";
      const Auth = window.AuthModule;
      const CFG_AUTH = (window.AppConfig && window.AppConfig.auth) || {};

      function setMsg(el, text, type) {
        if (!text) { el.classList.remove("show"); el.textContent = ""; return; }
        el.textContent = text;
        el.className = "msg show " + (type || "err");
      }

      function backUrl(role) {
        return role === Auth.ROLES.reviewer
          ? (CFG_AUTH.reviewerPage || "reviewer.html")
          : (CFG_AUTH.studentPage || "index.html");
      }

      function roleText(role) { return role === Auth.ROLES.reviewer ? "审核员" : "学生"; }
      function statusTag(status) {
        if (status === "verified") return '<span class="tag ok">已认证</span>';
        if (status === "rejected") return '<span class="tag bad">已拒绝</span>';
        return '<span class="tag warn">待认证</span>';
      }

      function render() {
        const user = Auth.getCurrentUser();
        if (!user) { Auth.gotoLogin(); return; }
        const av = user.avatar || { letter: "?", color: "#c8192e" };
        document.getElementById("profileCard").innerHTML =
          '<div class="avatar" style="background:' + av.color + ';">' + (av.letter || "?") + '</div>' +
          '<div>' +
            '<div class="pc-name">' + (user.nickname || user.studentId) + '</div>' +
            '<div class="pc-sub">学号 ' + user.studentId + ' · ' + (user.email || "无邮箱") + '</div>' +
            '<div class="pc-tags"><span class="tag role">' + roleText(user.role) + '</span>' + statusTag(user.status) + '</div>' +
          '</div>';
        document.getElementById("nickInput").value = user.nickname || user.studentId;
        document.getElementById("backBtn").href = backUrl(user.role);
        document.getElementById("loading").style.display = "none";
        document.getElementById("profileCard").style.display = "flex";
        document.getElementById("nickSection").style.display = "block";
        document.getElementById("pwdSection").style.display = "block";
        document.getElementById("logoutBtn").style.display = "block";
      }

      (async function init() {
        const user = await Auth.restore();
        if (!user) { Auth.gotoLogin(); return; }
        render();
      })();

      // 修改昵称
      document.getElementById("nickSave").addEventListener("click", async () => {
        const nickname = document.getElementById("nickInput").value.trim();
        const msg = document.getElementById("nickMsg");
        if (!nickname) { setMsg(msg, "昵称不能为空"); return; }
        const btn = document.getElementById("nickSave");
        btn.disabled = true; btn.textContent = "保存中…"; setMsg(msg, "");
        try {
          await Auth.updateProfile(nickname);
          render();
          setMsg(msg, "昵称已更新", "ok");
        } catch (e) { setMsg(msg, e.message); }
        finally { btn.disabled = false; btn.textContent = "保存"; }
      });

      // 修改密码
      document.getElementById("pwdSave").addEventListener("click", async () => {
        const oldP = document.getElementById("oldPwd").value;
        const newP = document.getElementById("newPwd").value;
        const confirmP = document.getElementById("confirmPwd").value;
        const msg = document.getElementById("pwdMsg");
        if (!oldP || !newP) { setMsg(msg, "请填写旧密码和新密码"); return; }
        if (newP.length < 6) { setMsg(msg, "新密码至少 6 位"); return; }
        if (newP !== confirmP) { setMsg(msg, "两次输入的新密码不一致"); return; }
        const btn = document.getElementById("pwdSave");
        btn.disabled = true; btn.textContent = "修改中…"; setMsg(msg, "");
        try {
          await Auth.changePassword(oldP, newP);
          document.getElementById("oldPwd").value = "";
          document.getElementById("newPwd").value = "";
          document.getElementById("confirmPwd").value = "";
          setMsg(msg, "密码已修改，下次登录请使用新密码", "ok");
        } catch (e) { setMsg(msg, e.message); }
        finally { btn.disabled = false; btn.textContent = "修改密码"; }
      });

      // 退出
      document.getElementById("logoutBtn").addEventListener("click", () => {
        Auth.logout();
        Auth.gotoLogin();
      });
    })();
  </script>
</body>
</html>
