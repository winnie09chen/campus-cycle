<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23c8192e'/><text x='32' y='32' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='-apple-system,PingFang SC,Microsoft YaHei,sans-serif'>候</text></svg>" />
  <title>物候 · 审核员工作台</title>
  <link rel="stylesheet" href="./common.css" />
  <style>
    :root {
      /* token 统一由 common.css 提供 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }
    h1, h2, h3, p { margin: 0; }

    .topbar {
      height: 64px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--red); color: #fff;
      display: grid; place-items: center; font-weight: 800;
    }
    .brand-title { font-size: 17px; font-weight: 760; }
    .brand-sub { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .back-link, .refresh-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .back-link:hover, .refresh-btn:hover {
      border-color: var(--red);
      color: var(--red);
      transform: translateY(-1px);
      box-shadow: var(--shadow-btn);
    }
    .back-link:active, .refresh-btn:active {
      transform: scale(0.96);
    }

    .stats-strip {
      width: min(1100px, calc(100% - 48px));
      margin: 22px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { display: block; font-size: 26px; color: var(--red); margin-top: 4px; }

    .main { width: min(1100px, calc(100% - 48px)); margin: 20px auto 40px; }
    .tabs {
      display: flex; gap: 8px; padding: 6px;
      background: #f0f1f3; border-radius: 8px; margin-bottom: 18px; width: fit-content;
    }
    .tab-btn {
      border: 0; border-radius: 7px; padding: 10px 22px;
      color: var(--muted); background: transparent; font-weight: 700;
    }
    .tab-btn:not(.active):hover { color: var(--ink); }
    .tab-btn:active { transform: scale(0.96); }
    .tab-btn.active { color: var(--red); background: #fff; box-shadow: 0 6px 18px rgba(32,36,42,0.08); }

    /* ===== 移动端菜单按钮（汉堡，默认桌面隐藏） ===== */
    .tabs-toggle {
      display: none;
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      position: relative;
      cursor: pointer;
    }
    .tabs-toggle:active { transform: scale(0.94); }
    .tabs-toggle-bars,
    .tabs-toggle-bars::before,
    .tabs-toggle-bars::after {
      position: absolute;
      left: 50%;
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: var(--ink);
      transition: transform .18s ease, opacity .18s ease;
    }
    .tabs-toggle-bars { top: 50%; transform: translate(-50%, -50%); }
    .tabs-toggle-bars::before,
    .tabs-toggle-bars::after {
      content: "";
      left: 0;
      transform: translate(0, 0);
    }
    .tabs-toggle-bars::before { top: -6px; }
    .tabs-toggle-bars::after { top: 6px; }
    .tabs-toggle.open .tabs-toggle-bars { background: transparent; }
    .tabs-toggle.open .tabs-toggle-bars::before { top: 0; transform: rotate(45deg); }
    .tabs-toggle.open .tabs-toggle-bars::after { top: 0; transform: rotate(-45deg); }

    /* ===== 菜单内返回按钮（桌面默认隐藏） ===== */
    .tabs-back { display: none; }
    .page { display: none; }
    .page.active { display: block; }

    .card-list { display: grid; gap: 14px; }
    .review-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
    }
    .review-card img {
      width: 160px; height: 160px; object-fit: cover;
      border-radius: 8px; background: #f0f1f3;
    }
    .thumb-placeholder {
      width: 160px; height: 160px; border-radius: 8px;
      background: #f0f1f3; display: grid; place-items: center;
      color: var(--muted); font-size: 12px;
    }
    .rc-body { display: flex; flex-direction: column; gap: 8px; }
    .rc-title { font-size: 16px; font-weight: 780; }
    .rc-meta { color: var(--muted); font-size: 13px; }
    .rc-ai {
      background: #fff7f8; border: 1px solid #ffe0e4; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; line-height: 1.6;
    }
    .rc-ai .label { color: var(--red); font-weight: 700; margin-right: 4px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { border-radius: 999px; background: #f2f3f5; color: #4c5563; padding: 5px 9px; font-size: 12px; }
    .tag.warn { background: #fff7e6; color: var(--warn); }
    .tag.bad { background: #fff1f0; color: var(--bad); }
    .rc-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .ok-btn, .danger-btn, .ghost-btn, .primary-btn {
      border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 760;
      will-change: transform;
    }
    .ok-btn:hover, .danger-btn:hover, .ghost-btn:hover, .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-btn);
    }
    .ok-btn:active, .danger-btn:active, .ghost-btn:active, .primary-btn:active {
      transform: scale(0.96);
    }
    .ok-btn { background: #ecfdf3; color: var(--ok); }
    .danger-btn { background: #fff1f0; color: var(--bad); }
    .ghost-btn { background: #f2f3f5; color: var(--ink); }
    .primary-btn { background: var(--red); color: #fff; width: 100%; }
    .primary-btn:hover { background: var(--red-dark); }
    .top-actions .primary-btn { width: auto; }
    .modal-actions .primary-btn { width: auto; }

    /* .empty 空状态组件统一定义于 common.css（手账风：装饰圆 + 标题 + 描述） */

    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters select, .filters input {
      border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: #fff;
    }
    .filters input { flex: 1; min-width: 180px; }

    /* 修改后通过 弹窗 */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(32,36,42,0.45); z-index: 50;
      align-items: center; justify-content: center;
    }
    .modal.active {
      display: flex;
      animation: fadeIn .2s var(--ease);
    }
    .modal.active .modal-content {
      animation: popIn .24s var(--ease);
    }
    .modal-content {
      background: #fff; border-radius: 12px; padding: 24px;
      width: min(520px, calc(100% - 32px)); box-shadow: var(--shadow);
    }
    .modal-content h3 { font-size: 18px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }

    /* ===== 设计系统统一层（token 见 common.css；置于末尾覆盖散落样式） ===== */
    .review-card,
    .modal-content,
    .ai-report {
      border-radius: var(--radius-lg);
    }
    .stats-strip,
    .stats-strip .stat {
      border-radius: var(--radius-md);
    }
    /* 手账风：统计条暖底 + tab 激活加重 */
    .stats-strip .stat strong { color: var(--gold); }
    .tabs { border-radius: var(--radius-md); }
    .tab-btn.active { font-weight: 800; }

    @media (max-width: 760px) {
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .review-card { grid-template-columns: 1fr; }
      .review-card img, .thumb-placeholder { width: 100%; height: 180px; }
    }

    /* ===== 移动端适配（<=600px） ===== */
    @media (max-width: 600px) {
    /* ===== 首屏鉴权遮罩（boot-gate：鉴权完成前隐藏内容） ===== */
    body.boot-gate > *:not(.boot-veil) { visibility: hidden; }
    .boot-veil {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg, #faf8f4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted, #68707d);
      font-size: 14px;
    }
    .boot-veil::before {
      content: "";
      width: 28px;
      height: 28px;
      border: 3px solid rgba(200, 25, 46, 0.18);
      border-top-color: #c8192e;
      border-radius: 50%;
      animation: bootspin .7s linear infinite;
    }
    @keyframes bootspin { to { transform: rotate(360deg); } }

    .topbar {
        height: auto;
        flex-wrap: wrap;
        padding: 10px 14px;
        gap: 10px;
      }
      .brand { flex: 1; min-width: 0; gap: 8px; }
      .brand-mark { width: 30px; height: 30px; border-radius: 7px; }
      .brand-title { font-size: 15px; }
      .brand-sub { display: none; }
      .top-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
      .back-link, .refresh-btn { padding: 8px 12px; font-size: 13px; }
      .top-actions .primary-btn { padding: 8px 12px; font-size: 13px; }

      .stats-strip { width: calc(100% - 24px); margin-top: 14px; gap: 10px; }
      .stat strong { font-size: 22px; }
      .main { width: calc(100% - 24px); margin-top: 14px; }

      .tabs-toggle { display: block; order: -1; }
      body.menu-open .topbar { z-index: 61; }
      .tabs { display: none; }
      .tabs.open {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 60;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 0 20px calc(20px + env(safe-area-inset-bottom));
        background: white;
        border-radius: 0;
        margin-bottom: 0;
        width: 100%;
        overflow-y: auto;
        animation: fadeIn .18s ease;
      }
      .tabs.open .tab-btn {
        flex: 0 0 auto;
        width: 100%;
        text-align: left;
        padding: 16px 18px;
        font-size: 16px;
        border: 1px solid var(--line);
        background: white;
        white-space: normal;
      }
      .tabs.open .tab-btn.active { box-shadow: 0 6px 18px rgba(32,36,42,0.08); }
      .tabs.open .tabs-back {
        display: block;
        position: sticky;
        top: 0;
        z-index: 1;
        width: 100%;
        text-align: left;
        padding: 12px 18px;
        font-size: 15px;
        font-weight: 600;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        cursor: pointer;
      }
      .tabs.open .tabs-back:active { transform: scale(0.98); }

      .filters input { min-width: 0; }
      .review-card img, .thumb-placeholder { height: 160px; }
      .modal-content { padding: 18px; }

      body { padding-bottom: env(safe-area-inset-bottom); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .batch-actions { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--bg); border-radius:10px; margin-bottom:12px; }
    .batch-checkbox { width:18px; height:18px; cursor:pointer; accent-color:var(--red); flex-shrink:0; }
    .audit-log { background:var(--bg); border-radius:10px; padding:14px; }
    .audit-log-item { padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
    .audit-log-item:last-child { border-bottom:0; }
    .review-item { background:var(--bg); border-radius:10px; padding:14px; margin-bottom:10px; }
    .review-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .review-reply { background:#fff; border-radius:8px; padding:10px; margin-top:8px; border-left:3px solid var(--red); }
    .primary-btn { background:var(--red); color:#fff; border:0; border-radius:8px; padding:9px 18px; font-weight:700; cursor:pointer; }
    .primary-btn:hover { background:var(--red-dark); transform:translateY(-1px); }
    .ghost-btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:9px 18px; cursor:pointer; font-weight:700; }
    .ghost-btn:hover { transform:translateY(-1px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- 鉴权快路径：无 token 同步跳登录，避免先渲染主界面再跳转的闪现 -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("campus_cycle_session_v1"));
        if (!s || !s.token) {
          location.replace("login.html");
          throw "redirect";
        }
      } catch (e) { if (e !== "redirect") location.replace("login.html"); }
      document.body.classList.add("boot-gate");
    })();
  </script>
  <div class="boot-veil" aria-hidden="true">正在进入工作台…</div>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">审</div>
      <div>
        <div class="brand-title">审核员工作台</div>
        <div class="brand-sub">审核 AI 识别结果 · 处理举报 · 治理物品池</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="tabs-toggle" aria-label="打开功能菜单" aria-expanded="false">
        <span class="tabs-toggle-bars" aria-hidden="true"></span>
      </button>
      <button class="primary-btn" id="addReviewerBtn">添加审核员</button>
      <button class="refresh-btn" id="refreshBtn">手动刷新</button>
      <div class="user-area" id="userArea"></div>
    </div>
  </header>

  <div class="stats-strip">
    <div class="stat"><span>待审核</span><strong id="statPending">0</strong></div>
    <div class="stat"><span>已通过</span><strong id="statApproved">0</strong></div>
    <div class="stat"><span>被举报</span><strong id="statReported">0</strong></div>
    <div class="stat"><span>援助锁定</span><strong id="statAidLocked">0</strong></div>
    <div class="stat"><span>已下架</span><strong id="statRemoved">0</strong></div>
    <div class="stat"><span>待认证用户</span><strong id="statPendingUsers">0</strong></div>
  </div>

  <div class="main" style="width: min(1100px, calc(100% - 48px)); margin: 20px auto 0;">
    <div class="audit-log" id="auditLogSection">
      <h4 style="margin-bottom:10px;">操作日志（最近 20 条）</h4>
      <div id="auditLogList"></div>
    </div>
  </div>

  <main class="main">
    <nav class="tabs">
      <button class="tabs-back" type="button">← 返回</button>
      <button class="tab-btn active" data-tab="pending">待审核</button>
      <button class="tab-btn" data-tab="report">举报处理</button>
      <button class="tab-btn" data-tab="aid">援助锁定</button>
      <button class="tab-btn" data-tab="all">全部物品</button>
      <button class="tab-btn" data-tab="users">用户审核</button>
      <button class="tab-btn" data-tab="trades">交易总览</button>
      <button class="tab-btn" data-tab="reviews">评价管理</button>
    </nav>

    <section class="page active" id="pagePending">
      <div class="batch-actions" id="batchActions" style="display:none;">
        <span id="batchCount" style="font-size:14px;color:var(--muted);margin-right:8px;">已选 0 项</span>
        <button class="primary-btn" id="batchApprove" style="background:var(--ok);">批量通过</button>
        <button class="ghost-btn" id="batchReject" style="color:var(--bad);border-color:var(--bad);">批量驳回</button>
        <button class="ghost-btn" id="batchClear">取消选择</button>
      </div>
      <div class="card-list" id="pendingList">
        <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-line w40"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div></div>
      </div>
    </section>

    <section class="page" id="pageReport">
      <div class="card-list" id="reportList"></div>
    </section>

    <section class="page" id="pageAid">
      <div class="card-list" id="aidLockedList"></div>
    </section>

    <section class="page" id="pageAll">
      <div class="filters">
        <select id="statusFilter">
          <option value="all">全部状态</option>
          <option value="pending">待审核</option>
          <option value="approved">已通过</option>
          <option value="removed">已下架</option>
        </select>
        <input id="searchInput" placeholder="搜索标题 / 科目 / 描述" />
      </div>
      <div class="card-list" id="allList"></div>
    </section>

    <section class="page" id="pageUsers">
      <div class="filters">
        <select id="userStatusFilter">
          <option value="pending">待认证</option>
          <option value="verified">已认证</option>
          <option value="rejected">已拒绝</option>
          <option value="all">全部用户</option>
        </select>
      </div>
      <div class="card-list" id="usersList"></div>
    </section>

    <section class="page" id="pageTrades">
      <div id="tradesStats" class="trade-stats"></div>
      <div class="trade-ai">
        <button class="primary-btn" id="aiTradesBtn">🤖 AI 分析交易流水</button>
        <div id="tradesAIReport" class="ai-report"></div>
      </div>
      <div class="card-list" id="tradesList"></div>
    </section>

    <section class="page" id="pageReviews">
      <h3 style="margin-bottom:16px;">评价管理</h3>
      <div id="reviewList"></div>
    </section>
  </main>

  <!-- 修改后通过 弹窗 -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>修改后通过（审核纠偏 AI 结果）</h3>
      <div class="field">
        <label>类别</label>
        <select id="editCategory">
          <option value="book">教材</option>
          <option value="uniform">校服/正装</option>
          <option value="bottle">水杯</option>
          <option value="lamp">台灯</option>
          <option value="backpack">书包</option>
          <option value="digital">数码配件</option>
          <option value="custom">其他</option>
        </select>
      </div>
      <div class="field">
        <label>自定义类别</label>
        <input id="editCustomCategory" placeholder="如：乐器、运动器材" />
      </div>
      <div class="field">
        <label>物品描述</label>
        <textarea id="editDescription"></textarea>
      </div>
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input id="editTags" />
      </div>
      <div class="modal-actions">
        <button class="primary-btn" id="editSave">保存并放行</button>
        <button class="ghost-btn" id="editCancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 添加审核员 弹窗 -->
  <div class="modal" id="reviewerModal">
    <div class="modal-content">
      <h3>添加审核员</h3>
      <div class="field">
        <label>学号</label>
        <input id="newReviewerId" placeholder="新审核员的学号（登录用户名）" />
      </div>
      <div class="field">
        <label>昵称（可选）</label>
        <input id="newReviewerName" placeholder="工作台显示昵称" />
      </div>
      <div class="field">
        <label>邮箱</label>
        <input id="newReviewerEmail" type="email" placeholder="密码将自动发送到此邮箱" />
      </div>
      <div class="modal-actions">
        <button class="primary-btn" id="reviewerSave">创建并发送密码</button>
        <button class="ghost-btn" id="reviewerCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./data-module.js"></script>
  <script src="./notify-module.js"></script>
  <script src="./auth-module.js"></script>
  <script>
    // ===== 审核员工作台 =====
    // @author: 同学C - 审核治理 + 整体集成
    // 与 index.html 共享 localStorage 数据，读写同一份物品池
    const STORAGE_KEY = (window.AppConfig && window.AppConfig.storageKeys && window.AppConfig.storageKeys.data) || "campus_cycle_demo_v1";
    var DM = window.DataModule;
    var NM = window.NotifyModule;
    var U = window.Utils;
    var categoryMap = DM.categoryMap;
    function getCategoryLabel(itemOrCategory) { return DM.getCategoryLabel(itemOrCategory); }
    function escapeHTML(value) { return U.escapeHTML(value); }

    let data = loadData();
    let editingId = null;

    function loadData() { return DM.loadData(); }
    function saveData() { DM.saveData(data); renderAll(); }
    function stripStoredImages(v) { return DM.stripStoredImages(v); }
    function addNotification(recipientId, type, title, body, meta) { NM.addNotification(data, recipientId, type, title, body, meta); }
    function authHeaders(extra) { return DM.authHeaders(extra); }

    const REMOTE_SYNC_MS = DM.getRemoteSyncMs();

    // 统一渲染一张审核卡片（待审核/举报/全部共用）
    function renderCard(item, actionsHtml) {
      const thumb = item.image
        ? `<img src="${escapeHTML(item.image)}" alt="物品图" />`
        : `<div class="thumb-placeholder">无图片</div>`;
      const tagsHtml = (item.tags || [])
        .filter((t) => t !== "待审核")
        .map((t) => `<span class="tag ${/遮挡|重拍|举报/.test(t) ? "warn" : ""}">${escapeHTML(t)}</span>`)
        .join("");
      var checkboxHtml = '<input type="checkbox" class="batch-checkbox" data-item-id="' + escapeHTML(item.id) + '" style="margin-right:8px;">';
      return `
        <article class="review-card">
          ${thumb}
          <div class="rc-body">
            <div class="rc-title">${checkboxHtml}${escapeHTML(item.title || "未命名物品")}</div>
            <div class="rc-meta">${escapeHTML(getCategoryLabel(item))} · 置信度 ${Math.round((item.confidence || 0) * 100)}% · ￥${Number(item.price) || 0} · ${escapeHTML(item.campus || item.major || "-")}</div>
            <div class="rc-ai"><span class="label">AI描述：</span>${escapeHTML(item.description || "（无）")}</div>
            ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
            <div class="rc-actions">${actionsHtml}</div>
          </div>
        </article>
      `;
    }

    function renderStats() {
      const counts = { pending: 0, approved: 0, reported: 0, aidLocked: 0, removed: 0 };
      data.items.forEach((it) => {
        if (it.status === "pending") counts.pending++;
        if (it.status === "approved") counts.approved++;
        if (it.status === "removed") counts.removed++;
        if (it.reports > 0) counts.reported++;
        if (it.aidStatus === "locked") counts.aidLocked++;
      });
      document.getElementById("statPending").textContent = counts.pending;
      document.getElementById("statApproved").textContent = counts.approved;
      document.getElementById("statReported").textContent = counts.reported;
      document.getElementById("statAidLocked").textContent = counts.aidLocked;
      document.getElementById("statRemoved").textContent = counts.removed;
    }

    function renderPending() {
      const pending = data.items.filter((it) => it.status === "pending");
      const list = document.getElementById("pendingList");
      list.innerHTML = pending.length
        ? pending.map((it) => renderCard(it, `
            <button class="ok-btn" data-approve="${escapeHTML(it.id)}">通过</button>
            <button class="danger-btn" data-remove="${escapeHTML(it.id)}">驳回下架</button>
            <button class="ghost-btn" data-edit="${escapeHTML(it.id)}">修改后通过</button>
          `)).join("")
        : `<div class="empty"><div class="empty-deco">📋</div><div class="empty-title">暂无待审核物品</div><div class="empty-desc">卖家提交后会实时出现在这里，喝口茶等等吧</div></div>`;
    }

    function renderReport() {
      const reported = data.items.filter((it) => it.reports > 0);
      const list = document.getElementById("reportList");
      list.innerHTML = reported.length
        ? reported.map((it) => renderCard(it, `
            <span class="tag bad">${Number(it.reports) || 0} 次举报</span>
            <button class="ghost-btn" data-clear="${escapeHTML(it.id)}">忽略举报</button>
            <button class="danger-btn" data-remove="${escapeHTML(it.id)}">违规下架</button>
          `)).join("")
        : `<div class="empty">暂无被举报物品</div>`;
    }

    function renderAidLocked() {
      const locked = data.items.filter((it) => it.aidStatus === "locked");
      const list = document.getElementById("aidLockedList");
      list.innerHTML = locked.length
        ? locked.map((it) => {
            const need = (data.aidNeeds || []).find((entry) => entry.id === it.lockedAidId);
            const needInfo = need
              ? `<div class="rc-ai"><span class="label">锁定申请：</span>${escapeHTML(need.studentCode || "脱敏编号缺失")} · ${escapeHTML(getCategoryLabel(need))} · ${escapeHTML(need.urgency || "-")} · ${escapeHTML(need.text || "")}</div>`
              : `<div class="rc-ai"><span class="label">锁定申请：</span>未找到对应援助申请。</div>`;
            return renderCard(it, `
              ${needInfo}
              <span class="tag warn">援助锁定</span>
              <button class="ok-btn" data-aid-complete="${escapeHTML(it.lockedAidId || "")}">完成援助</button>
              <button class="ghost-btn" data-aid-release="${escapeHTML(it.lockedAidId || "")}">取消锁定</button>
            `);
          }).join("")
        : `<div class="empty">暂无援助锁定物品（主站援助池锁定后会出现在这里）</div>`;
    }

    function renderAllItems() {
      const status = document.getElementById("statusFilter").value;
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      let items = data.items;
      if (status !== "all") items = items.filter((it) => it.status === status);
      if (kw) {
        items = items.filter((it) =>
          [it.title, it.subject, it.description].some((s) => (s || "").toLowerCase().includes(kw))
        );
      }
      const list = document.getElementById("allList");
      list.innerHTML = items.length
        ? items.map((it) => {
            const statusTag = it.status === "approved"
              ? `<span class="tag">已通过</span>`
              : it.status === "removed" ? `<span class="tag bad">已下架</span>` : `<span class="tag warn">待审核</span>`;
            return renderCard(it, statusTag);
          }).join("")
        : `<div class="empty">没有匹配的物品</div>`;
    }

    // ===== 交易总览（只读监察） =====
    function orderStatusText(s) {
      return { paid: "待卖家确认", accepted: "已接受·待完成", completed: "已完成", cancelled: "已取消", declined: "卖家已拒绝" }[s] || s;
    }
    function renderTrades() {
      const orders = data.orders || [];
      const completed = orders.filter((o) => o.status === "completed");
      const volume = completed.reduce((s, o) => s + Number(o.price || 0), 0);
      const active = orders.filter((o) => o.status === "paid" || o.status === "accepted").length;
      document.getElementById("tradesStats").innerHTML =
        '<div class="trade-stat"><span>订单总数</span><strong>' + orders.length + '</strong></div>' +
        '<div class="trade-stat"><span>进行中</span><strong>' + active + '</strong></div>' +
        '<div class="trade-stat"><span>已完成</span><strong>' + completed.length + '</strong></div>' +
        '<div class="trade-stat"><span>成交总额</span><strong>￥' + volume + '</strong></div>';
      const list = document.getElementById("tradesList");
      list.innerHTML = orders.length
        ? orders.map((o) => {
            const cls = o.status === "completed" ? "" : (o.status === "cancelled" || o.status === "declined" ? "bad" : "warn");
            return '<article class="review-card" style="grid-template-columns:1fr;">' +
              '<div class="rc-body">' +
                '<div class="rc-title">' + escapeHTML(o.itemTitle || "物品") + ' <span class="tag ' + cls + '">' + orderStatusText(o.status) + '</span></div>' +
                '<div class="rc-meta">￥' + (Number(o.price) || 0) + ' · 买家 ' + escapeHTML(o.buyerName || o.buyerId || "-") + ' · 卖家 ' + escapeHTML(o.sellerName || o.sellerId || "-") + ' · ' + escapeHTML(o.createdAt || "") + '</div>' +
              '</div>' +
            '</article>';
          }).join("")
        : `<div class="empty"><div class="empty-deco">🧾</div><div class="empty-title">暂无交易记录</div><div class="empty-desc">有同学开始交易后，这里会出现订单流水与 AI 分析入口</div></div>`;
    }

    // ===== AI 交易流水分析（脱敏后发 qwen-plus） =====
    function renderMarkdown(md) {
      const lines = md.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split("\n");
      let out = "";
      let inList = false;
      const closeList = () => { if (inList) { out += "</ul>"; inList = false; } };
      for (const line of lines) {
        const t = line.trim();
        if (/^### /.test(t)) { closeList(); out += "<h4>" + t.slice(4) + "</h4>"; }
        else if (/^## /.test(t)) { closeList(); out += "<h3>" + t.slice(3) + "</h3>"; }
        else if (/^# /.test(t)) { closeList(); out += "<h3>" + t.slice(2) + "</h3>"; }
        else if (/^[-*] /.test(t)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + t.slice(2) + "</li>"; }
        else if (t === "") { closeList(); }
        else { closeList(); out += "<p>" + t + "</p>"; }
      }
      closeList();
      out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      out = out.replace(/(频繁取消|多次被拒|价格异常|异常|风险|偏高|建议关注)/g, '<span class="ai-risk">$1</span>');
      return out;
    }

    async function analyzeTrades() {
      const orders = data.orders || [];
      const reportEl = document.getElementById("tradesAIReport");
      const btn = document.getElementById("aiTradesBtn");
      if (!orders.length) { reportEl.innerHTML = '<div class="ai-empty">暂无交易数据，无法分析。</div>'; return; }

      // 脱敏：买卖家按首次出现分配稳定别名
      const buyerMap = {}, sellerMap = {};
      let bi = 0, si = 0;
      const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const flow = orders.map((o) => ({
        item: o.itemTitle || "物品",
        price: o.price,
        status: o.status,
        buyer: buyerMap[o.buyerId] || (buyerMap[o.buyerId] = "买家" + L[bi++]),
        seller: sellerMap[o.sellerId] || (sellerMap[o.sellerId] = "卖家" + L[si++]),
        time: o.createdAt || ""
      }));

      // 统计
      const completed = orders.filter((o) => o.status === "completed");
      const cancelled = orders.filter((o) => o.status === "cancelled");
      const declined = orders.filter((o) => o.status === "declined");
      const volume = completed.reduce((s, o) => s + Number(o.price || 0), 0);
      const stats = {
        total: orders.length,
        completed: completed.length,
        cancelled: cancelled.length,
        declined: declined.length,
        volume,
        avgPrice: completed.length ? Math.round(volume / completed.length) : 0,
        completeRate: orders.length ? Math.round((completed.length / orders.length) * 100) : 0
      };

      btn.disabled = true; btn.classList.add("is-loading"); btn.textContent = "🤖 分析中…";
      reportEl.innerHTML = '<div class="ai-loading">正在分析交易流水…</div>';

      const messages = [
        { role: "system", content: "你是校园二手平台的交易数据分析助手。根据脱敏后的交易流水与统计，输出简明、可执行的 markdown 分析报告。只基于给定的数据分析，不要编造不存在的订单或数字。" },
        { role: "user", content:
          "统计：总笔数 " + stats.total + "，成交 " + stats.completed + " 笔，成交额 ￥" + stats.volume +
          "，完成率 " + stats.completeRate + "%，平均客单价 ￥" + stats.avgPrice +
          "，取消 " + stats.cancelled + " 笔，拒绝 " + stats.declined + " 笔。\n\n" +
          "脱敏流水（buyer/seller 已脱敏）：\n" + JSON.stringify(flow) + "\n\n" +
          "请用 markdown 严格按以下结构输出：\n" +
          "## 概览\n（一句话整体情况）\n" +
          "## 异常与风险\n（取消/拒绝率是否偏高、是否有买家频繁取消、卖家多次被拒、价格异常；若无异常请明确说明）\n" +
          "## 品类洞察\n（哪类物品交易最活跃，从物品名推断）\n" +
          "## 运营建议\n（2-3 条可执行建议）" }
      ];

      try {
        const res = await fetch("/.netlify/functions/ai", {
          method: "POST",
          headers: authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ model: "qwen-plus", messages, temperature: 0.4, max_tokens: 800 })
        });
        const payload = await res.json().catch(() => ({}));
        const content = payload && payload.choices && payload.choices[0] && payload.choices[0].message && payload.choices[0].message.content;
        if (!content) throw new Error(payload && payload.error ? payload.error : "AI 未返回内容");
        reportEl.innerHTML = renderMarkdown(content);
      } catch (e) {
        reportEl.innerHTML = '<div class="ai-error">分析失败：' + escapeHTML(e.message) + '</div>';
      } finally {
        btn.disabled = false; btn.classList.remove("is-loading"); btn.textContent = "🤖 AI 分析交易流水";
      }
    }

    function renderAll() {
      data = loadData();
      renderStats();
      renderPending();
      renderReport();
      renderAidLocked();
      renderAllItems();
      renderTrades();
      renderAuditLogs();
      renderReviewManagement();
      bindBatchEvents();
    }

    // 远程同步已下沉至 data-module.js（DM.initSync(renderAll)），模块状态为唯一真相源

    // ===== 审核动作 =====
    // 心愿匹配判断：类别相同 + 科目双向包含 + 非卖家本人（与 index 端规则一致）
    function wishMatchesItem(wish, item) {
      if (!wish || !item) return false;
      if (wish.ownerId === item.ownerId) return false;
      if (wish.category !== item.category) return false;
      const ws = (wish.subject || "").trim();
      const isb = (item.subject || "").trim();
      if (!ws || !isb) return true;
      return ws.includes(isb) || isb.includes(ws);
    }

    // 物品审核通过后：通知心愿匹配的买家（通过被审核物品 ownerName 只通知买家本人，不暴露他人）
    function notifyWishlistMatches(item) {
      const wishlist = Array.isArray(data.wishlist) ? data.wishlist : [];
      wishlist.forEach((w) => {
        if (!wishMatchesItem(w, item)) return;
        addNotification(w.ownerId, "info", "心愿单上新",
          `你想要的「${getCategoryLabel(item)} · ${item.subject || "不限"}」有新物品《${item.title || "物品"}》￥${Number(item.price) || 0}，快去看看吧。`,
          { itemId: item.id });
      });
    }

    function approve(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.status = "approved";
      it.tags = (it.tags || []).filter((t) => t !== "待审核");
      addNotification(
        it.ownerId,
        "item_approved",
        "审核通过提醒",
        `你的「${it.title || it.subject || "物品"}」已审核通过，买家现在可以看到并购买。`,
        { itemId: it.id }
      );
      notifyWishlistMatches(it);
      saveData();
    }

    function remove(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.status = "removed";
      saveData();
    }

    function clearReport(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.reports = 0;
      saveData();
    }

    function completeAid(needId) {
      const need = (data.aidNeeds || []).find((entry) => entry.id === needId);
      if (!need || !need.lockedItemId) return;
      const item = data.items.find((entry) => entry.id === need.lockedItemId);
      need.status = "done";
      need.updatedAt = new Date().toLocaleString("zh-CN");
      if (item) {
        item.aidStatus = "donated";
        item.status = "removed";
        item.tags = [...new Set([...(item.tags || []).filter((tag) => tag !== "援助锁定"), "已援助"])];
      }
      data.aidDoneCount = (data.aidDoneCount || 0) + 1;
      saveData();
      // "已完成"卡片显示 2 秒后自动移除
      setTimeout(() => {
        data = loadData();
        data.aidNeeds = (data.aidNeeds || []).filter((entry) => entry.id !== needId);
        saveData();
      }, 2000);
    }

    function releaseAid(needId) {
      const need = (data.aidNeeds || []).find((entry) => entry.id === needId);
      if (!need) return;
      const item = data.items.find((entry) => entry.id === need.lockedItemId);
      if (item) {
        item.aidStatus = "";
        item.lockedAidId = "";
        item.tags = (item.tags || []).filter((tag) => tag !== "援助锁定");
      }
      need.status = "matching";
      need.lockedItemId = "";
      need.updatedAt = new Date().toLocaleString("zh-CN");
      saveData();
    }

    function openEdit(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      editingId = id;
      document.getElementById("editCategory").value = categoryMap[it.category] ? it.category : "book";
      document.getElementById("editCustomCategory").value = it.customCategory || "";
      document.getElementById("editDescription").value = it.description || "";
      document.getElementById("editTags").value = (it.tags || []).filter((t) => t !== "待审核").join(", ");
      document.getElementById("editModal").classList.add("active");
    }

    function saveEdit() {
      const it = data.items.find((x) => x.id === editingId);
      if (!it) return;
      const customCategory = document.getElementById("editCustomCategory").value.trim();
      it.category = customCategory ? "custom" : document.getElementById("editCategory").value;
      it.customCategory = customCategory;
      it.title = `${getCategoryLabel(it)}-${it.subject || "物品"}`;
      it.description = document.getElementById("editDescription").value.trim();
      const tags = document.getElementById("editTags").value
        .split(/[,，]/).map((s) => s.trim()).filter(Boolean);
      it.tags = ["审核修正", ...tags];
      it.status = "approved";
      addNotification(
        it.ownerId,
        "item_approved",
        "审核通过提醒",
        `你的「${it.title || it.subject || "物品"}」已由审核员修正后通过，买家现在可以看到并购买。`,
        { itemId: it.id }
      );
      notifyWishlistMatches(it);
      editingId = null;
      document.getElementById("editModal").classList.remove("active");
      saveData();
    }

    // ===== 用户审核（认证学生身份） =====
    let usersList = [];

    function userStatusText(u) {
      return u.status === "verified" ? "已认证" : u.status === "rejected" ? "已拒绝" : "待认证";
    }
    function userStatusTag(u) {
      const cls = u.status === "verified" ? "" : u.status === "rejected" ? "bad" : "warn";
      return `<span class="tag ${cls}">${userStatusText(u)}</span>`;
    }

    async function renderUsers() {
      const filter = document.getElementById("userStatusFilter").value;
      const list = document.getElementById("usersList");
      let all = [];
      try {
        const body = await window.AuthModule.listUsers(null);
        all = body.users || [];
      } catch (e) {
        list.innerHTML = `<div class="empty">用户列表加载失败：${escapeHTML(e.message)}</div>`;
        return;
      }
      document.getElementById("statPendingUsers").textContent =
        all.filter((u) => u.status === "pending").length;
      usersList = filter === "all" ? all : all.filter((u) => u.status === filter);

      list.innerHTML = usersList.length
        ? usersList.map((u) => `
            <article class="review-card">
              <div style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:24px;background:${/^[#][0-9a-fA-F]{3,8}$/.test((u.avatar && u.avatar.color) || "") ? u.avatar.color : "#c8192e"};flex:0 0 auto;">${escapeHTML((u.avatar && u.avatar.letter) || "?")}</div>
              <div class="rc-body">
                <div class="rc-title">${escapeHTML(u.nickname || u.studentId)} <span class="tag">${u.role === "reviewer" ? "审核员" : "学生"}</span> ${userStatusTag(u)}</div>
                <div class="rc-meta">学号 ${escapeHTML(u.studentId)} · ${escapeHTML(u.email || "无邮箱")}</div>
                <div class="rc-actions">
                  ${u.role === "student" && u.status === "pending"
                    ? `<button class="ok-btn" data-user-verify="${escapeHTML(u.studentId)}">通过认证</button><button class="danger-btn" data-user-reject="${escapeHTML(u.studentId)}">拒绝</button>`
                    : ""}
                </div>
              </div>
            </article>
          `).join("")
        : `<div class="empty"><div class="empty-deco">👥</div><div class="empty-title">暂无符合条件的用户</div><div class="empty-desc">新同学注册后会出现在这里等待认证</div></div>`;
    }

    async function verifyUserDo(studentId) {
      try { await window.AuthModule.verifyUser(studentId, "verify"); renderUsers(); }
      catch (e) { alert(e.message); }
    }
    async function rejectUserDo(studentId) {
      try { await window.AuthModule.verifyUser(studentId, "reject"); renderUsers(); }
      catch (e) { alert(e.message); }
    }

    function updateUserArea() {
      const user = window.AuthModule.getCurrentUser();
      const el = document.getElementById("userArea");
      if (!el) return;
      if (!user) { el.innerHTML = ""; return; }
      el.innerHTML =
        '<a href="profile.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;">' +
        window.AuthModule.avatarHtml(user, 30) +
        '<span class="u-name">' + (user.nickname || user.studentId) + '</span>' +
        '</a>' +
        '<button class="u-logout" id="logoutBtn">退出</button>';
      document.getElementById("logoutBtn").addEventListener("click", () => {
        window.AuthModule.logout();
        window.AuthModule.gotoLogin();
      });
    }

    // ===== 事件绑定 =====
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        var tabName = btn.dataset.tab;
        var pageId = "page" + tabName.charAt(0).toUpperCase() + tabName.slice(1);
        var pageEl = document.getElementById(pageId);
        if (pageEl) pageEl.classList.add("active");
        if (tabName === "users") renderUsers();
        if (tabName === "trades") renderTrades();
        if (tabName === "reviews") renderReviewManagement();
        closeTabsMenu();
      });
    });

    // ===== 弹窗通用交互：遮罩点击 + ESC 关闭 =====
    document.querySelectorAll(".modal").forEach((modal) => {
      modal.addEventListener("click", (e) => {
        if (e.target === modal) { modal.classList.remove("active"); editingId = null; }
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const open = document.querySelector(".modal.active");
        if (open) { open.classList.remove("active"); editingId = null; }
      }
    });

    // ===== 移动端功能菜单（汉堡按钮） =====
    const tabsToggle = document.querySelector(".tabs-toggle");
    const tabsNav = document.querySelector(".tabs");
    const tabsBack = document.querySelector(".tabs-back");
    const topbarEl = document.querySelector(".topbar");
    function openTabsMenu() {
      tabsNav.style.paddingTop = (topbarEl.offsetHeight + 16) + "px";
      tabsNav.classList.add("open");
      tabsToggle.classList.add("open");
      tabsToggle.setAttribute("aria-expanded", "true");
      document.body.classList.add("menu-open");
      document.body.style.overflow = "hidden";
    }
    function closeTabsMenu() {
      if (!tabsNav.classList.contains("open")) return;
      tabsNav.classList.remove("open");
      tabsNav.style.paddingTop = "";
      tabsToggle.classList.remove("open");
      tabsToggle.setAttribute("aria-expanded", "false");
      document.body.classList.remove("menu-open");
      document.body.style.overflow = "";
    }
    tabsToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      if (tabsNav.classList.contains("open")) closeTabsMenu();
      else openTabsMenu();
    });
    tabsBack.addEventListener("click", closeTabsMenu);
    document.addEventListener("click", (e) => {
      if (tabsNav.classList.contains("open") && !tabsNav.contains(e.target) && !tabsToggle.contains(e.target)) closeTabsMenu();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeTabsMenu();
    });
    // 离开移动端断点时自动收起菜单（清理跨断点残留的样式/状态）
    window.matchMedia("(max-width: 600px)").addEventListener("change", (e) => {
      if (!e.matches) closeTabsMenu();
    });

    document.body.addEventListener("click", (event) => {
      const { approve: ap, remove: rm, edit, clear, aidComplete, aidRelease, userVerify, userReject } = event.target.dataset;
      if (ap) approve(ap);
      if (rm) remove(rm);
      if (edit) openEdit(edit);
      if (clear) clearReport(clear);
      if (aidComplete) completeAid(aidComplete);
      if (aidRelease) releaseAid(aidRelease);
      if (userVerify) verifyUserDo(userVerify);
      if (userReject) rejectUserDo(userReject);
    });

    document.getElementById("editSave").addEventListener("click", saveEdit);
    document.getElementById("editCancel").addEventListener("click", () => {
      editingId = null;
      document.getElementById("editModal").classList.remove("active");
    });
    document.getElementById("statusFilter").addEventListener("change", renderAllItems);
    document.getElementById("searchInput").addEventListener("input", renderAllItems);
    document.getElementById("refreshBtn").addEventListener("click", renderAll);
    document.getElementById("aiTradesBtn").addEventListener("click", analyzeTrades);
    document.getElementById("userStatusFilter").addEventListener("change", renderUsers);

    // 添加审核员
    document.getElementById("addReviewerBtn").addEventListener("click", () => {
      document.getElementById("reviewerModal").classList.add("active");
    });
    document.getElementById("reviewerCancel").addEventListener("click", () => {
      document.getElementById("reviewerModal").classList.remove("active");
    });
    document.getElementById("reviewerSave").addEventListener("click", async () => {
      const studentId = document.getElementById("newReviewerId").value.trim();
      const email = document.getElementById("newReviewerEmail").value.trim();
      const nickname = document.getElementById("newReviewerName").value.trim();
      if (!studentId || !email) { alert("请填写学号和邮箱"); return; }
      const btn = document.getElementById("reviewerSave");
      btn.disabled = true; btn.textContent = "创建中…";
      try {
        await window.AuthModule.addReviewer(studentId, email, nickname);
        alert("审核员已创建，密码已发送到其邮箱");
        document.getElementById("reviewerModal").classList.remove("active");
        document.getElementById("newReviewerId").value = "";
        document.getElementById("newReviewerEmail").value = "";
        document.getElementById("newReviewerName").value = "";
        renderUsers();
      } catch (e) {
        alert(e.message);
      } finally {
        btn.disabled = false; btn.textContent = "创建并发送密码";
      }
    });

    // 跨页实时同步：主站/卖家页写入数据时触发
    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) renderAll();
    });

    // ===== 批量操作 =====
    var selectedItems = new Set();

    function toggleItemSelection(itemId, checked) {
      if (checked) selectedItems.add(itemId);
      else selectedItems.delete(itemId);
      updateBatchUI();
    }

    function updateBatchUI() {
      var batchActions = document.getElementById('batchActions');
      var batchCount = document.getElementById('batchCount');
      if (batchActions) {
        batchActions.style.display = selectedItems.size > 0 ? 'flex' : 'none';
      }
      if (batchCount) {
        batchCount.textContent = '已选 ' + selectedItems.size + ' 项';
      }
    }

    function clearSelection() {
      selectedItems.clear();
      document.querySelectorAll('.batch-checkbox').forEach(function(cb) { cb.checked = false; });
      updateBatchUI();
    }

    async function batchApprove() {
      if (selectedItems.size === 0) return;
      var confirmed = await Utils.confirmDialog('确认批量通过 ' + selectedItems.size + ' 个物品的审核？', '批量审核');
      if (!confirmed) return;

      data.items.forEach(function(item) {
        if (selectedItems.has(item.id)) {
          item.status = 'approved';
          addNotification(item.ownerId, 'success', '物品审核通过', '你的物品「' + (item.title || item.subject) + '」已通过审核，已上架。');
          notifyWishlistMatches(item);
        }
      });

      if (!Array.isArray(data.auditLogs)) data.auditLogs = [];
      data.auditLogs.push({
        id: Utils.generateId('audit'),
        reviewerId: (window.AuthModule.getCurrentUser() || {}).studentId || '',
        action: 'batch_approve',
        itemIds: Array.from(selectedItems),
        count: selectedItems.size,
        timestamp: new Date().toISOString()
      });

      clearSelection();
      saveData();
      Utils.showToast('已批量通过 ' + selectedItems.size + ' 个物品', 'success');
    }

    async function batchReject() {
      if (selectedItems.size === 0) return;
      var confirmed = await Utils.confirmDialog('确认批量驳回 ' + selectedItems.size + ' 个物品的审核？', '批量驳回');
      if (!confirmed) return;

      data.items.forEach(function(item) {
        if (selectedItems.has(item.id)) {
          item.status = 'rejected';
          addNotification(item.ownerId, 'warn', '物品审核未通过', '你的物品「' + (item.title || item.subject) + '」未通过审核，请修改后重新提交。');
        }
      });

      if (!Array.isArray(data.auditLogs)) data.auditLogs = [];
      data.auditLogs.push({
        id: Utils.generateId('audit'),
        reviewerId: (window.AuthModule.getCurrentUser() || {}).studentId || '',
        action: 'batch_reject',
        itemIds: Array.from(selectedItems),
        count: selectedItems.size,
        timestamp: new Date().toISOString()
      });

      clearSelection();
      saveData();
      Utils.showToast('已批量驳回 ' + selectedItems.size + ' 个物品', 'warn');
    }

    function bindBatchEvents() {
      document.querySelectorAll('.batch-checkbox').forEach(function(cb) {
        cb.onchange = function() {
          toggleItemSelection(this.dataset.itemId, this.checked);
        };
      });

      var approveBtn = document.getElementById('batchApprove');
      var rejectBtn = document.getElementById('batchReject');
      var clearBtn = document.getElementById('batchClear');
      if (approveBtn) approveBtn.onclick = batchApprove;
      if (rejectBtn) rejectBtn.onclick = batchReject;
      if (clearBtn) clearBtn.onclick = clearSelection;
    }

    // ===== 评价管理 =====
    function renderReviewManagement() {
      var container = document.getElementById('reviewList');
      if (!container) return;
      if (!Array.isArray(data.reviews) || data.reviews.length === 0) {
        container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px;">暂无评价记录</p>';
        return;
      }

      container.innerHTML = data.reviews.slice().reverse().map(function(review) {
        var item = data.items.find(function(i) { return i.id === review.itemId; });
        var stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
        return [
          '<div class="review-item">',
          '<div class="review-header">',
          '<strong>' + escapeHTML(item ? item.title : '未知物品') + '</strong>',
          '<span style="color:#f5a623;">' + stars + '</span>',
          '</div>',
          '<p style="font-size:14px;color:var(--ink);">' + escapeHTML(review.text || '无文字评价') + '</p>',
          '<div style="font-size:12px;color:var(--muted);margin-top:4px;">',
          '评价人: ' + escapeHTML(review.reviewerId) + ' · 被评人: ' + escapeHTML(review.revieweeId) + ' · ' + (review.createdAt || '').slice(0,10),
          '</div>',
          review.reply ? '<div class="review-reply"><strong>卖家回复：</strong>' + escapeHTML(review.reply) + '</div>' : '',
          '<div style="margin-top:8px;">',
          '<button class="ghost-btn" data-delete-review="' + review.id + '" style="color:var(--bad);font-size:12px;">删除异常评价</button>',
          '</div>',
          '</div>'
        ].join('');
      }).join('');

      container.querySelectorAll('[data-delete-review]').forEach(function(btn) {
        btn.onclick = async function() {
          var reviewId = this.dataset.deleteReview;
          var confirmed = await Utils.confirmDialog('确认删除此评价？此操作不可撤销。', '删除评价');
          if (!confirmed) return;
          data.reviews = data.reviews.filter(function(r) { return r.id !== reviewId; });
          saveData();
          Utils.showToast('评价已删除', 'success');
          renderReviewManagement();
        };
      });
    }

    // ===== 审计日志 =====
    function renderAuditLogs() {
      var container = document.getElementById('auditLogList');
      if (!container) return;
      if (!Array.isArray(data.auditLogs) || data.auditLogs.length === 0) {
        container.innerHTML = '<p style="color:var(--muted);font-size:13px;">暂无操作日志</p>';
        return;
      }
      container.innerHTML = data.auditLogs.slice().reverse().slice(0, 20).map(function(log) {
        var actionLabel = log.action === 'batch_approve' ? '批量通过' : log.action === 'batch_reject' ? '批量驳回' : log.action;
        return '<div class="audit-log-item"><strong>' + escapeHTML(log.reviewerId) + '</strong> ' +
          actionLabel + ' ' + (log.count || 0) + ' 项 · ' + (log.timestamp || '').slice(0, 19) + '</div>';
      }).join('');
    }

    // ===== 鉴权门禁：仅审核员可进入工作台；未登录/角色不符 → 跳登录页 =====
    function liftBootGate() {
      document.body.classList.remove("boot-gate");
      const veil = document.querySelector(".boot-veil");
      if (veil) veil.remove();
    }
    (async function () {
      const ok = await window.AuthModule.requireRole(window.AuthModule.ROLES.reviewer);
      if (!ok) return; // 即将跳登录页，保持遮罩避免闪现
      updateUserArea();
      renderAll();
      DM.initSync(renderAll);
      renderUsers();
      setInterval(renderUsers, REMOTE_SYNC_MS); // 定期刷新用户审核列表
      liftBootGate();
    })();
  </script>
</body>
</html>
