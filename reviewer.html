<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23c8192e'/><text x='32' y='32' font-size='38' font-weight='800' fill='%23fff' text-anchor='middle' dominant-baseline='central' font-family='-apple-system,PingFang SC,Microsoft YaHei,sans-serif'>候</text></svg>" />
  <title>物候 · 审核员工作台</title>
  <style>
    :root {
      --red: #c8192e;
      --red-dark: #9f1426;
      --ink: #20242a;
      --muted: #68707d;
      --line: #e6e8ec;
      --bg: #f7f8fa;
      --ok: #168a52;
      --warn: #b56a00;
      --bad: #b42318;
      --card: #ffffff;
      --shadow: 0 16px 40px rgba(32, 36, 42, 0.08);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-btn: 0 6px 16px rgba(32, 36, 42, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }
    h1, h2, h3, p { margin: 0; }

    .topbar {
      height: 64px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--red); color: #fff;
      display: grid; place-items: center; font-weight: 800;
    }
    .brand-title { font-size: 17px; font-weight: 760; }
    .brand-sub { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .back-link, .refresh-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      transition: transform .18s var(--ease), background-color .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .back-link:hover, .refresh-btn:hover {
      border-color: var(--red);
      color: var(--red);
      transform: translateY(-1px);
      box-shadow: var(--shadow-btn);
    }
    .back-link:active, .refresh-btn:active {
      transform: scale(0.96);
    }

    .stats-strip {
      width: min(1100px, calc(100% - 48px));
      margin: 22px auto 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { display: block; font-size: 26px; color: var(--red); margin-top: 4px; }

    .main { width: min(1100px, calc(100% - 48px)); margin: 20px auto 40px; }
    .tabs {
      display: flex; gap: 8px; padding: 6px;
      background: #f0f1f3; border-radius: 8px; margin-bottom: 18px; width: fit-content;
    }
    .tab-btn {
      border: 0; border-radius: 7px; padding: 10px 22px;
      color: var(--muted); background: transparent; font-weight: 700;
    }
    .tab-btn:not(.active):hover { color: var(--ink); }
    .tab-btn:active { transform: scale(0.96); }
    .tab-btn.active { color: var(--red); background: #fff; box-shadow: 0 6px 18px rgba(32,36,42,0.08); }
    .page { display: none; }
    .page.active { display: block; }

    .card-list { display: grid; gap: 14px; }
    .review-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
    }
    .review-card img {
      width: 160px; height: 160px; object-fit: cover;
      border-radius: 8px; background: #f0f1f3;
    }
    .thumb-placeholder {
      width: 160px; height: 160px; border-radius: 8px;
      background: #f0f1f3; display: grid; place-items: center;
      color: var(--muted); font-size: 12px;
    }
    .rc-body { display: flex; flex-direction: column; gap: 8px; }
    .rc-title { font-size: 16px; font-weight: 780; }
    .rc-meta { color: var(--muted); font-size: 13px; }
    .rc-ai {
      background: #fff7f8; border: 1px solid #ffe0e4; border-radius: 8px;
      padding: 10px 12px; font-size: 13px; line-height: 1.6;
    }
    .rc-ai .label { color: var(--red); font-weight: 700; margin-right: 4px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { border-radius: 999px; background: #f2f3f5; color: #4c5563; padding: 5px 9px; font-size: 12px; }
    .tag.warn { background: #fff7e6; color: var(--warn); }
    .tag.bad { background: #fff1f0; color: var(--bad); }
    .rc-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .ok-btn, .danger-btn, .ghost-btn, .primary-btn {
      border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 760;
      will-change: transform;
    }
    .ok-btn:hover, .danger-btn:hover, .ghost-btn:hover, .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-btn);
    }
    .ok-btn:active, .danger-btn:active, .ghost-btn:active, .primary-btn:active {
      transform: scale(0.96);
    }
    .ok-btn { background: #ecfdf3; color: var(--ok); }
    .danger-btn { background: #fff1f0; color: var(--bad); }
    .ghost-btn { background: #f2f3f5; color: var(--ink); }
    .primary-btn { background: var(--red); color: #fff; width: 100%; }
    .primary-btn:hover { background: var(--red-dark); }

    .empty {
      color: var(--muted); text-align: center; padding: 40px 12px;
      border: 1px dashed var(--line); border-radius: 8px; background: #fafafa;
    }

    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters select, .filters input {
      border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: #fff;
    }
    .filters input { flex: 1; min-width: 180px; }

    /* 修改后通过 弹窗 */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(32,36,42,0.45); z-index: 50;
      align-items: center; justify-content: center;
    }
    .modal.active {
      display: flex;
      animation: fadeIn .2s var(--ease);
    }
    .modal.active .modal-content {
      animation: popIn .24s var(--ease);
    }
    .modal-content {
      background: #fff; border-radius: 12px; padding: 24px;
      width: min(520px, calc(100% - 32px)); box-shadow: var(--shadow);
    }
    .modal-content h3 { font-size: 18px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }

    @media (max-width: 760px) {
      .stats-strip { grid-template-columns: repeat(2, 1fr); }
      .review-card { grid-template-columns: 1fr; }
      .review-card img, .thumb-placeholder { width: 100%; height: 180px; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">审</div>
      <div>
        <div class="brand-title">审核员工作台</div>
        <div class="brand-sub">审核 AI 识别结果 · 处理举报 · 治理物品池</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="refresh-btn" id="refreshBtn">手动刷新</button>
      <a href="index.html" class="back-link">← 返回主站</a>
    </div>
  </header>

  <div class="stats-strip">
    <div class="stat"><span>待审核</span><strong id="statPending">0</strong></div>
    <div class="stat"><span>已通过</span><strong id="statApproved">0</strong></div>
    <div class="stat"><span>被举报</span><strong id="statReported">0</strong></div>
    <div class="stat"><span>援助锁定</span><strong id="statAidLocked">0</strong></div>
    <div class="stat"><span>已下架</span><strong id="statRemoved">0</strong></div>
  </div>

  <main class="main">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="pending">待审核</button>
      <button class="tab-btn" data-tab="report">举报处理</button>
      <button class="tab-btn" data-tab="aid">援助锁定</button>
      <button class="tab-btn" data-tab="all">全部物品</button>
    </nav>

    <section class="page active" id="pagePending">
      <div class="card-list" id="pendingList"></div>
    </section>

    <section class="page" id="pageReport">
      <div class="card-list" id="reportList"></div>
    </section>

    <section class="page" id="pageAid">
      <div class="card-list" id="aidLockedList"></div>
    </section>

    <section class="page" id="pageAll">
      <div class="filters">
        <select id="statusFilter">
          <option value="all">全部状态</option>
          <option value="pending">待审核</option>
          <option value="approved">已通过</option>
          <option value="removed">已下架</option>
        </select>
        <input id="searchInput" placeholder="搜索标题 / 科目 / 描述" />
      </div>
      <div class="card-list" id="allList"></div>
    </section>
  </main>

  <!-- 修改后通过 弹窗 -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3>修改后通过（审核纠偏 AI 结果）</h3>
      <div class="field">
        <label>类别</label>
        <select id="editCategory">
          <option value="book">教材</option>
          <option value="uniform">校服/正装</option>
          <option value="bottle">水杯</option>
          <option value="lamp">台灯</option>
          <option value="backpack">书包</option>
          <option value="digital">数码配件</option>
          <option value="custom">其他</option>
        </select>
      </div>
      <div class="field">
        <label>自定义类别</label>
        <input id="editCustomCategory" placeholder="如：乐器、运动器材" />
      </div>
      <div class="field">
        <label>物品描述</label>
        <textarea id="editDescription"></textarea>
      </div>
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input id="editTags" />
      </div>
      <div class="modal-actions">
        <button class="primary-btn" id="editSave">保存并放行</button>
        <button class="ghost-btn" id="editCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script>
    // ===== 审核员工作台 =====
    // @author: 同学C - 审核治理 + 整体集成
    // 与 index.html 共享 localStorage 数据，读写同一份物品池
    const STORAGE_KEY = (window.AppConfig && window.AppConfig.storageKeys && window.AppConfig.storageKeys.data) || "campus_cycle_demo_v1";
    const categoryMap = {
      book: "教材", uniform: "校服", lamp: "台灯",
      backpack: "书包", bottle: "水杯", clothing: "校服/正装", digital: "数码配件", custom: "其他"
    };

    function getCategoryLabel(itemOrCategory) {
      if (typeof itemOrCategory === "object" && itemOrCategory) {
        return itemOrCategory.customCategory || categoryMap[itemOrCategory.category] || itemOrCategory.category || "其他";
      }
      return categoryMap[itemOrCategory] || itemOrCategory || "其他";
    }

    let data = loadData();
    let editingId = null;

    function loadData() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return { items: [], demands: [], aidNeeds: [] };
      try {
        const parsed = JSON.parse(stored);
        return {
          ...parsed,
          items: Array.isArray(parsed.items) ? parsed.items : [],
          demands: Array.isArray(parsed.demands) ? parsed.demands : [],
          aidNeeds: Array.isArray(parsed.aidNeeds) ? parsed.aidNeeds : []
        };
      } catch (e) {
        return { items: [], demands: [], aidNeeds: [] };
      }
    }

    function stripStoredImages(value) {
      return {
        ...value,
        items: (value.items || []).map((item) => ({
          ...item,
          image: item.image && !String(item.image).startsWith("data:") ? item.image : ""
        })),
        currentDraft: value.currentDraft ? { ...value.currentDraft, image: "" } : null
      };
    }

    const REMOTE_DATA_URL = "/.netlify/functions/data";
    const REMOTE_SYNC_MS = 3000;
    let remoteSnapshot = "";
    let remoteSaving = false;

    function normalizeData(value) {
      return {
        ...value,
        items: Array.isArray(value.items) ? value.items : [],
        demands: Array.isArray(value.demands) ? value.demands : [],
        aidNeeds: Array.isArray(value.aidNeeds) ? value.aidNeeds : [],
        currentDraft: value.currentDraft || null
      };
    }

    async function fetchRemoteData() {
      if (location.protocol === "file:") return null;
      const response = await fetch(REMOTE_DATA_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("远程数据读取失败：" + response.status);
      const payload = await response.json();
      return payload && payload.data ? normalizeData(payload.data) : null;
    }

    async function pushRemoteData(value) {
      if (location.protocol === "file:") return;
      remoteSaving = true;
      try {
        const clean = stripStoredImages(value);
        const body = JSON.stringify(clean);
        remoteSnapshot = body;
        const response = await fetch(REMOTE_DATA_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body
        });
        if (!response.ok) throw new Error("远程数据保存失败：" + response.status);
      } catch (error) {
        console.warn("远程同步失败，已保留本地数据：", error.message);
      } finally {
        remoteSaving = false;
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        console.warn("localStorage 写入失败，已移除图片后重试：", error.message);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stripStoredImages(data)));
      }
      renderAll();
      pushRemoteData(data);
    }

    // 统一渲染一张审核卡片（待审核/举报/全部共用）
    function renderCard(item, actionsHtml) {
      const thumb = item.image
        ? `<img src="${item.image}" alt="物品图" />`
        : `<div class="thumb-placeholder">无图片</div>`;
      const tagsHtml = (item.tags || [])
        .filter((t) => t !== "待审核")
        .map((t) => `<span class="tag ${/遮挡|重拍|举报/.test(t) ? "warn" : ""}">${t}</span>`)
        .join("");
      return `
        <article class="review-card">
          ${thumb}
          <div class="rc-body">
            <div class="rc-title">${item.title || "未命名物品"}</div>
            <div class="rc-meta">${getCategoryLabel(item)} · 置信度 ${Math.round((item.confidence || 0) * 100)}% · ￥${item.price ?? "-"} · ${item.campus || item.major || "-"}</div>
            <div class="rc-ai"><span class="label">AI描述：</span>${item.description || "（无）"}</div>
            ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
            <div class="rc-actions">${actionsHtml}</div>
          </div>
        </article>
      `;
    }

    function renderStats() {
      const counts = { pending: 0, approved: 0, reported: 0, aidLocked: 0, removed: 0 };
      data.items.forEach((it) => {
        if (it.status === "pending") counts.pending++;
        if (it.status === "approved") counts.approved++;
        if (it.status === "removed") counts.removed++;
        if (it.reports > 0) counts.reported++;
        if (it.aidStatus === "locked") counts.aidLocked++;
      });
      document.getElementById("statPending").textContent = counts.pending;
      document.getElementById("statApproved").textContent = counts.approved;
      document.getElementById("statReported").textContent = counts.reported;
      document.getElementById("statAidLocked").textContent = counts.aidLocked;
      document.getElementById("statRemoved").textContent = counts.removed;
    }

    function renderPending() {
      const pending = data.items.filter((it) => it.status === "pending");
      const list = document.getElementById("pendingList");
      list.innerHTML = pending.length
        ? pending.map((it) => renderCard(it, `
            <button class="ok-btn" data-approve="${it.id}">通过</button>
            <button class="danger-btn" data-remove="${it.id}">驳回下架</button>
            <button class="ghost-btn" data-edit="${it.id}">修改后通过</button>
          `)).join("")
        : `<div class="empty">暂无待审核物品（卖家提交后会实时出现在这里）</div>`;
    }

    function renderReport() {
      const reported = data.items.filter((it) => it.reports > 0);
      const list = document.getElementById("reportList");
      list.innerHTML = reported.length
        ? reported.map((it) => renderCard(it, `
            <span class="tag bad">${it.reports} 次举报</span>
            <button class="ghost-btn" data-clear="${it.id}">忽略举报</button>
            <button class="danger-btn" data-remove="${it.id}">违规下架</button>
          `)).join("")
        : `<div class="empty">暂无被举报物品</div>`;
    }

    function renderAidLocked() {
      const locked = data.items.filter((it) => it.aidStatus === "locked");
      const list = document.getElementById("aidLockedList");
      list.innerHTML = locked.length
        ? locked.map((it) => {
            const need = (data.aidNeeds || []).find((entry) => entry.id === it.lockedAidId);
            const needInfo = need
              ? `<div class="rc-ai"><span class="label">锁定申请：</span>${need.studentCode || "脱敏编号缺失"} · ${getCategoryLabel(need)} · ${need.urgency || "-"} · ${need.text || ""}</div>`
              : `<div class="rc-ai"><span class="label">锁定申请：</span>未找到对应援助申请。</div>`;
            return renderCard(it, `
              ${needInfo}
              <span class="tag warn">援助锁定</span>
              <button class="ok-btn" data-aid-complete="${it.lockedAidId || ""}">完成援助</button>
              <button class="ghost-btn" data-aid-release="${it.lockedAidId || ""}">取消锁定</button>
            `);
          }).join("")
        : `<div class="empty">暂无援助锁定物品（主站援助池锁定后会出现在这里）</div>`;
    }

    function renderAllItems() {
      const status = document.getElementById("statusFilter").value;
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();
      let items = data.items;
      if (status !== "all") items = items.filter((it) => it.status === status);
      if (kw) {
        items = items.filter((it) =>
          [it.title, it.subject, it.description].some((s) => (s || "").toLowerCase().includes(kw))
        );
      }
      const list = document.getElementById("allList");
      list.innerHTML = items.length
        ? items.map((it) => {
            const statusTag = it.status === "approved"
              ? `<span class="tag">已通过</span>`
              : it.status === "removed" ? `<span class="tag bad">已下架</span>` : `<span class="tag warn">待审核</span>`;
            return renderCard(it, statusTag);
          }).join("")
        : `<div class="empty">没有匹配的物品</div>`;
    }

    function renderAll() {
      data = loadData();
      renderStats();
      renderPending();
      renderReport();
      renderAidLocked();
      renderAllItems();
    }

    async function syncFromRemote() {
      if (remoteSaving) return;
      try {
        const remoteData = await fetchRemoteData();
        if (!remoteData) return;
        const nextSnapshot = JSON.stringify(stripStoredImages(remoteData));
        if (nextSnapshot !== remoteSnapshot) {
          remoteSnapshot = nextSnapshot;
          localStorage.setItem(STORAGE_KEY, nextSnapshot);
          renderAll();
        }
      } catch (error) {
        console.warn("远程数据读取失败，继续使用本地数据：", error.message);
      }
    }

    function initRemoteSync() {
      syncFromRemote();
      if (location.protocol !== "file:") {
        setInterval(syncFromRemote, REMOTE_SYNC_MS);
      }
    }

    // ===== 审核动作 =====
    function approve(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.status = "approved";
      it.tags = (it.tags || []).filter((t) => t !== "待审核");
      saveData();
    }

    function remove(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.status = "removed";
      saveData();
    }

    function clearReport(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      it.reports = 0;
      saveData();
    }

    function completeAid(needId) {
      const need = (data.aidNeeds || []).find((entry) => entry.id === needId);
      if (!need || !need.lockedItemId) return;
      const item = data.items.find((entry) => entry.id === need.lockedItemId);
      need.status = "done";
      need.updatedAt = new Date().toLocaleString("zh-CN");
      if (item) {
        item.aidStatus = "donated";
        item.status = "removed";
        item.tags = [...new Set([...(item.tags || []).filter((tag) => tag !== "援助锁定"), "已援助"])];
      }
      data.aidDoneCount = (data.aidDoneCount || 0) + 1;
      saveData();
      // "已完成"卡片显示 2 秒后自动移除
      setTimeout(() => {
        data = loadData();
        data.aidNeeds = (data.aidNeeds || []).filter((entry) => entry.id !== needId);
        saveData();
      }, 2000);
    }

    function releaseAid(needId) {
      const need = (data.aidNeeds || []).find((entry) => entry.id === needId);
      if (!need) return;
      const item = data.items.find((entry) => entry.id === need.lockedItemId);
      if (item) {
        item.aidStatus = "";
        item.lockedAidId = "";
        item.tags = (item.tags || []).filter((tag) => tag !== "援助锁定");
      }
      need.status = "matching";
      need.lockedItemId = "";
      need.updatedAt = new Date().toLocaleString("zh-CN");
      saveData();
    }

    function openEdit(id) {
      const it = data.items.find((x) => x.id === id);
      if (!it) return;
      editingId = id;
      document.getElementById("editCategory").value = categoryMap[it.category] ? it.category : "book";
      document.getElementById("editCustomCategory").value = it.customCategory || "";
      document.getElementById("editDescription").value = it.description || "";
      document.getElementById("editTags").value = (it.tags || []).filter((t) => t !== "待审核").join(", ");
      document.getElementById("editModal").classList.add("active");
    }

    function saveEdit() {
      const it = data.items.find((x) => x.id === editingId);
      if (!it) return;
      const customCategory = document.getElementById("editCustomCategory").value.trim();
      it.category = customCategory ? "custom" : document.getElementById("editCategory").value;
      it.customCategory = customCategory;
      it.title = `${getCategoryLabel(it)}-${it.subject || "物品"}`;
      it.description = document.getElementById("editDescription").value.trim();
      const tags = document.getElementById("editTags").value
        .split(/[,，]/).map((s) => s.trim()).filter(Boolean);
      it.tags = ["审核修正", ...tags];
      it.status = "approved";
      editingId = null;
      document.getElementById("editModal").classList.remove("active");
      saveData();
    }

    // ===== 事件绑定 =====
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b === btn));
        document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
        document.getElementById("page" + btn.dataset.tab.charAt(0).toUpperCase() + btn.dataset.tab.slice(1)).classList.add("active");
      });
    });

    document.body.addEventListener("click", (event) => {
      const { approve: ap, remove: rm, edit, clear, aidComplete, aidRelease } = event.target.dataset;
      if (ap) approve(ap);
      if (rm) remove(rm);
      if (edit) openEdit(edit);
      if (clear) clearReport(clear);
      if (aidComplete) completeAid(aidComplete);
      if (aidRelease) releaseAid(aidRelease);
    });

    document.getElementById("editSave").addEventListener("click", saveEdit);
    document.getElementById("editCancel").addEventListener("click", () => {
      editingId = null;
      document.getElementById("editModal").classList.remove("active");
    });
    document.getElementById("statusFilter").addEventListener("change", renderAllItems);
    document.getElementById("searchInput").addEventListener("input", renderAllItems);
    document.getElementById("refreshBtn").addEventListener("click", renderAll);

    // 跨页实时同步：主站/卖家页写入数据时触发
    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) renderAll();
    });

    renderAll();
    initRemoteSync();
  </script>
</body>
</html>
